<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DOM Interaction Example</title>
  <link rel="stylesheet" href="index.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Header -->
  <header>
    <h1 id="main-title">Welcome to My Web Page</h1>
  </header>

  <!-- Main Section -->
  <main>
    <section>
      <p id="intro-text">This paragraph will change when you click the button.</p>
      <button onclick="changeText()">Change Text</button>
    </section>

    <section>
      <p id="style-target">Click the button to change my style!</p>
      <button onclick="changeStyle()">Change Style</button>
    </section>

    <section>
      <div id="element-container">
        <p>This section can dynamically add or remove a message.</p>
      </div>
      <button onclick="addElement()">Add Element</button>
      <button onclick="removeElement()">Remove Element</button>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>Contact: keith@contact.com</p>
  </footer>

  <source src="script.js" type="js">
</body>
</html>
